<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#171923"/>
  <circle cx="1050" cy="60" r="130" fill="#A78BFA" opacity="0.30"/>
  <circle cx="1120" cy="300" r="110" fill="#A3FF12" opacity="0.18"/>
  <circle cx="880" cy="330" r="90" fill="#536DFE" opacity="0.35"/>
  <circle cx="60" cy="40" r="70" fill="#536DFE" opacity="0.25"/>
  <!-- shield -->
  <g>
    <path d="M 1000 110 L 1090 110 L 1090 205 Q 1090 260 1045 290 Q 1000 260 1000 205 Z" fill="#A78BFA"/>
    <path d="M 1000 110 L 1090 110 L 1090 205 Q 1090 260 1045 290 Q 1000 260 1000 205 Z" fill="none" stroke="#A3FF12" stroke-width="4"/>
    <polyline points="1010,190 1035,215 1075,165" fill="none" stroke="#171923" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="80" y="130" font-size="58" font-weight="700" fill="#ffffff">APK Security Pipeline</text>
    <text x="80" y="175" font-size="22" fill="#D1D5DB">One command. Every check explained. One report you can act on.</text>
    <text x="80" y="205" font-size="18" fill="#A78BFA">Static checks + Frida runtime traces + scoring + CI-ready reports</text>
    <!-- pills -->
    <g font-size="16" font-weight="700">
      <rect x="80" y="235" width="150" height="40" rx="20" fill="#A3FF12"/>
      <text x="155" y="261" text-anchor="middle" fill="#171923">Pure Python</text>
      <rect x="245" y="235" width="190" height="40" rx="20" fill="#A78BFA"/>
      <text x="340" y="261" text-anchor="middle" fill="#171923">64 tests passing</text>
      <rect x="450" y="235" width="200" height="40" rx="20" fill="#536DFE"/>
      <text x="550" y="261" text-anchor="middle" fill="#ffffff">Zero dependencies</text>
      <rect x="665" y="235" width="160" height="40" rx="20" fill="#ffffff"/>
      <text x="745" y="261" text-anchor="middle" fill="#171923">Explain mode</text>
    </g>
    <text x="80" y="320" font-size="15" fill="#9CA3AF">Only for apps you own or have explicit permission to test.</text>
  </g>
</svg>
