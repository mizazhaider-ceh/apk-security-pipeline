<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#17191C">Sample results at a glance</text>
    <text x="80" y="90" font-size="18" font-weight="700" fill="#17191C">Clean sample</text>
    <rect x="250" y="68" width="800" height="30" rx="15" fill="#E5E7EB"/>
    <rect x="250" y="68" width="800" height="30" rx="15" fill="#4E7A12"/>
    <text x="1070" y="90" font-size="18" font-weight="700" fill="#4E7A12">100 / A</text>
    <text x="80" y="140" font-size="18" font-weight="700" fill="#17191C">Vulnerable sample</text>
    <rect x="250" y="118" width="800" height="30" rx="15" fill="#E5E7EB"/>
    <rect x="250" y="118" width="14" height="30" rx="7" fill="#B91C1C"/>
    <text x="1070" y="140" font-size="18" font-weight="700" fill="#B91C1C">0 / F</text>
    <text x="600" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#17191C">Vulnerable sample: 24 findings by severity</text>
    <text x="80" y="230" font-size="17" font-weight="700" fill="#B91C1C">Critical</text>
    <rect x="250" y="210" width="800" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="250" y="210" width="70" height="26" rx="13" fill="#B91C1C"/>
    <text x="1070" y="230" font-size="17" font-weight="700" fill="#17191C">1</text>
    <text x="80" y="275" font-size="17" font-weight="700" fill="#D97706">High</text>
    <rect x="250" y="255" width="800" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="250" y="255" width="560" height="26" rx="13" fill="#D97706"/>
    <text x="1070" y="275" font-size="17" font-weight="700" fill="#17191C">8</text>
    <text x="80" y="320" font-size="17" font-weight="700" fill="#A16207">Medium</text>
    <rect x="250" y="300" width="800" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="250" y="300" width="490" height="26" rx="13" fill="#EAB308"/>
    <text x="1070" y="320" font-size="17" font-weight="700" fill="#17191C">7</text>
    <text x="80" y="365" font-size="17" font-weight="700" fill="#4E7A12">Low</text>
    <rect x="250" y="345" width="800" height="26" rx="13" fill="#E5E7EB"/>
    <rect x="250" y="345" width="560" height="26" rx="13" fill="#4E7A12"/>
    <text x="1070" y="365" font-size="17" font-weight="700" fill="#17191C">8</text>
    <text x="600" y="410" text-anchor="middle" font-size="14" fill="#5C6068">Same tool, same rules. The clean app passes with zero noise.</text>
  </g>
</svg>
